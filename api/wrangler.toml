name = "baby-tracker-api"
main = "src/index.ts"
compatibility_date = "2025-05-19"
compatibility_flags = ["nodejs_compat"]

[vars]
BETTER_AUTH_URL = "https://baby-tracker-api.abbaspuzi-dev.workers.dev/api"
FRONTEND_URL = "https://baby-tracker.abbaspuzi-dev.workers.dev"

# Secrets (set via wrangler secret put):
#   DATABASE_URL
#   BETTER_AUTH_SECRET
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET

[dev]
port = 8787

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1